name: Android Release

# Builds a signed release APK + AAB, then publishes a GitHub Release with the
# APK as a public download asset. Triggered by a version tag (e.g. v2.0.0)
# or manually via workflow_dispatch.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   – base64 of android/release.jks
#                       Generate: base64 -w0 android/release.jks | pbcopy
#   KEYSTORE_PASSWORD – keystore password
#   KEY_ALIAS         – key alias (fsd)
#   KEY_PASSWORD      – key password

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create GitHub Release?"
        type: boolean
        default: true

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level env so step-level `if:` guards can actually read it. Previously
    # KEYSTORE_BASE64 was declared inside the step it guarded, so the condition was
    # evaluated before it existed and the keystore was never decoded.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Fail fast if the signing key is missing
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::KEYSTORE_BASE64 secret is not set - the release would be UNSIGNED."
          echo "Set KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD in repo secrets."
          exit 1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed release APK + AAB (free and pro flavors)
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          assembleFreeRelease bundleFreeRelease
          assembleProRelease

      - name: Rename artifacts for clean filenames
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/free/release/app-free-release.apk \
             ../dist/FreeAndroidDoctor-free.apk
          cp app/build/outputs/bundle/freeRelease/app-free-release.aab \
             ../dist/FreeAndroidDoctor-free.aab
          cp app/build/outputs/apk/pro/release/app-pro-release.apk \
             ../dist/FreeAndroidDoctor-pro.apk
        working-directory: android

      - name: Verify the artifacts are actually signed
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in ../dist/FreeAndroidDoctor-free.apk ../dist/FreeAndroidDoctor-pro.apk; do
            echo "Verifying $f"
            "$BT/apksigner" verify --print-certs "$f"
          done
        working-directory: android

      # Permanent public URL after this step:
      # https://github.com/caytec/FreeAndroidDoctor/releases/latest/download/FreeAndroidDoctor-free.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FreeAndroidDoctor $TAG" \
            --notes "## FreeAndroidDoctor $TAG

          **Pobierz APK** (poniżej) i zainstaluj ręcznie na telefonie.
          Wymagany Android 8.0+.

          ### Jak zainstalować
          1. Pobierz \`FreeAndroidDoctor-free.apk\`
          2. Otwórz plik na telefonie
          3. Gdy pojawi się komunikat o nieznanym źródle — zezwól dla przeglądarki/pliku
          4. Zainstaluj i gotowe

          ---

          **Download APK** below and sideload on any Android 8.0+ phone.
          " \
            --latest \
            ../dist/FreeAndroidDoctor-free.apk \
            ../dist/FreeAndroidDoctor-free.aab \
            ../dist/FreeAndroidDoctor-pro.apk
        working-directory: android

      - name: Upload APK artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: fsd-release-apk
          path: dist/FreeAndroidDoctor-free.apk
          if-no-files-found: warn
